{% extends "base.html" %}

{% block title %}Вход - Пассажирам.РФ{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow">
            <div class="card-body p-4">
                <h2 class="text-center mb-4">
                    <i class="bi bi-box-arrow-in-right text-primary"></i>Вход
                </h2>

                <form method="POST" action="{{ url_for('login') }}">
                    {# Логин #}
                    <div class="mb-3">
                        <label for="login" class="form-label">
                            <i class="bi bi-person"></i>Логин
                        </label>
                        <input type="text" 
                        class="form-control" 
                        id="login" 
                        name="login" 
                        placeholder="Введите логин"
                        required>
                    </div>

                    {# Пароли #}
                    <div class="mb-3">
                        <label for="password" class="form-label">
                            <i class="bi bi-person"></i>Пароль
                        </label>
                        <input type="password" 
                        class="form-control" 
                        id="password" 
                        name="password"  
                        placeholder="Введите пароль" 
                        required>
                    </div>

                    <button class="btn btn-primary w-100 mt-3">
                        <i class="bi bi-check-circle"></i>Войти
                    </button>
                </form>

                <div class="text-center mt-3">
                    <p class="mb-0">Еще не зарегистрированны?
                        <a href="{{ url_for('register') }}">Регистрация</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
